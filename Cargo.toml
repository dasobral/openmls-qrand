[package]
name = "openmls_qrng_provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "generic OpenMLS QRNG Open API randomness provider"

[dependencies]
openmls_traits = "0.6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tiny_http = "0.12"
