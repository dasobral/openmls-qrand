[package]
name = "openmls_qrand"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "OpenMLS randomness provider backed by a QRNG Open API"
repository = "https://github.com/dasobral/openmls-qrand"
homepage = "https://github.com/dasobral/openmls-qrand"
readme = "README.md"
authors = ["Daniel SB <dasobral93@gmail.com>"]
keywords = ["openmls", "mls", "qrng", "entropy", "randomness"]
categories = ["cryptography", "network-programming"]

[dependencies]
openmls_traits = "0.6.0"
# TLS: reqwest over a rustls client that this crate configures itself (aws-lc-rs, with the
# hybrid post quantum key exchange X25519MLKEM768), see `KeyExchange`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
# The `rand` 0.10 RNG traits, for `EntropyRng`.
rand_core = "0.10"

[features]
# A deterministic in-process backend for development and tests. NOT an entropy source.
mock = []

[dev-dependencies]
rand_core = "0.10"
tiny_http = "0.12"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
