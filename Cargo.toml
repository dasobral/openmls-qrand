[package]
name = "openmls_qrand"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "OpenMLS randomness provider backed by a QRNG Open API"
repository = "https://github.com/dasobral/openmls-qrand"
homepage = "https://github.com/dasobral/openmls-qrand"
readme = "README.md"
authors = ["Daniel SB <dasobral93@gmail.com>"]
keywords = ["openmls", "mls", "qrng", "entropy", "randomness"]
categories = ["cryptography", "network-programming"]

[dependencies]
openmls_traits = "0.6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tiny_http = "0.12"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
